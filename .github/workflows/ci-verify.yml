name: CI Verify

on:
  push:
    branches: [main]
    paths:
      - "huji-app/**"
      - ".github/workflows/ci-verify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/auto-tag.yml"
  pull_request:
    paths:
      - "huji-app/**"
      - ".github/workflows/ci-verify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/auto-tag.yml"

concurrency:
  group: ci-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: huji-app

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            platform: linux
            install_linux_deps: true
          - os: windows-latest
            label: Windows
            platform: windows
            install_linux_deps: false
          - os: macos-latest
            label: macOS
            platform: macos
            install_linux_deps: false
          - os: ubuntu-22.04
            label: Android
            platform: android
            install_linux_deps: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libjsoncpp-dev libstdc++-12-dev \
            libasound2-dev libmpv-dev mpv \
            libjson-glib-dev

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        if: matrix.platform == 'android'
        run: yes | flutter doctor --android-licenses

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Guard macOS Impeller off
        if: matrix.platform == 'macos'
        run: |
          # Packaged + default macos launches read FLTEnableImpeller from Info.plist.
          value=$(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' macos/Runner/Info.plist)
          if [ "$value" != "false" ]; then
            echo "Expected FLTEnableImpeller=false in macos/Runner/Info.plist, got: $value" >&2
            exit 1
          fi

      - name: Install ffmpeg (Windows)
        if: matrix.platform == 'windows'
        run: choco install ffmpeg -y

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test --exclude-tags integration

      - name: Patch FFmpegKit Windows headers for native build
        if: matrix.platform == 'windows'
        run: ./scripts/patch_ffmpeg_kit_windows.ps1

      - name: Clean Windows build dependencies
        if: matrix.platform == 'windows'
        run: flutter clean

      - name: Resolve Flutter packages for Windows build
        if: matrix.platform == 'windows'
        run: flutter pub get

      - name: Build Windows offline badminton app
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Bundle static Windows FFmpeg binaries
        if: matrix.platform == 'windows'
        shell: bash
        run: bash ./scripts/bundle_ffmpeg_windows.sh build/windows/x64/runner/Release

      - name: Verify Windows app bundle contents
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'build/windows/x64/runner/Release'
          $requiredFiles = @(
            'huji.exe',
            'flutter_windows.dll',
            'ffmpeg.exe',
            'ffprobe.exe',
            'ncnn_plugin.dll',
            'ncnn.dll',
            'ncnn_helper.exe',
            'media_kit_video_plugin.dll',
            'media_kit_libs_windows_video_plugin.dll',
            'libmpv-2.dll',
            'd3dcompiler_47.dll',
            'libEGL.dll',
            'libGLESv2.dll',
            'vk_swiftshader.dll',
            'vulkan-1.dll',
            'zlib.dll',
            'data/icudtl.dat'
          )
          foreach ($relativePath in $requiredFiles) {
            $candidate = Join-Path $bundle $relativePath
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Windows bundle is missing required runtime file: $relativePath"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bundle 'data/flutter_assets') -PathType Container)) {
            throw 'Windows bundle is missing Flutter assets.'
          }

      - name: Smoke test Windows ncnn GPU probe and CPU fallback
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'build/windows/x64/runner/Release/huji.exe'
          & $app --ncnn-selftest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows ncnn self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows offline badminton app
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: huji-offline-badminton-windows
          path: huji-app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Install ffmpeg (Linux integration tests)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS integration tests)
        if: matrix.platform == 'macos'
        run: brew install ffmpeg

      - name: Build linux debug (ncnn plugin for integration tests)
        if: matrix.platform == 'linux'
        run: flutter build linux --debug

      - name: Build macos debug (ncnn plugin for integration tests)
        if: matrix.platform == 'macos'
        run: flutter build macos --debug

      - name: Integration tests (CPU fallback — no GPU on runners)
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        run: flutter test --tags integration
